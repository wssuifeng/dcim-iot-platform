name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, refactor/depivot]
  pull_request:
    branches: [main, develop, refactor/depivot]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        # 与项目 pom.xml 中 mysql-connector-j 9.6.0 保持一致
        image: mysql:9.6.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: iot_device_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test (Backend)
        env:
          DB_URL: jdbc:mysql://localhost:3306/iot_device_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          DB_USERNAME: root
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-key-for-testing-only-32chars
        run: mvn clean verify -B

      # JaCoCo 覆盖率报告（pom 内 verify 阶段产出），暂不设覆盖率门禁
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          # 使用 npm install 而非 npm ci：
          # 项目 lock 文件由 Windows 本地生成，可能缺少 Linux 平台的可选依赖
          # （如 @rolldown/binding-wasm32-wasi → @emnapi/core@1.11.1）
          # npm install 会自动补齐当前平台缺失的依赖，避免跨平台 lock 不完整问题
          npm install --no-frozen-lockfile
          npm run build

      # 前端测试（S8-8 落地 vitest 后自动生效；脚本不存在时跳过）
      - name: Frontend tests
        working-directory: frontend
        run: npm run test --if-present

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Package JAR
        run: mvn clean package -DskipTests -B

      - name: Build Docker Image
        run: docker build -t iot-platform:${{ github.sha }} .

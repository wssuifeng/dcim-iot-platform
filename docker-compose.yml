services:
  app:
    build: .
    container_name: iot-platform-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # app 容器通过服务名访问依赖；.env.example 的 localhost 用于宿主机开发
      - DB_URL=jdbc:mysql://mysql:3306/iot_device_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INGEST_MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mysql:
    # 与项目 pom.xml 中 mysql-connector-j 9.6.0 保持一致
    image: mysql:9.6.0
    container_name: iot-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: iot_device_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iot-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MQTT broker：数据接收门北向通道（平台订阅 dcim/+/samples 等 topic）
  # 启用平台 MQTT 适配器需设 INGEST_MQTT_ENABLED=true
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-platform-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok", "-q", "1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  mosquitto_data:

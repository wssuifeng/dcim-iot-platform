# ==================== 生产环境配置 ====================
# 所有敏感信息必须从环境变量注入，禁止在配置文件中硬编码

# ==================== 生产环境 HTTPS 配置模板 ====================
# 启用前需准备有效 SSL 证书，并替换环境变量值
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}

spring:
  # 数据源配置（Druid）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 连接泄漏检测（生产级）
      log-abandoned: true
      remove-abandoned: true
      remove-abandoned-timeout: 1800

      # 生产环境关闭 Druid 监控面板，避免暴露敏感信息
      stat-view-servlet:
        enabled: false

      # Web 请求监控过滤器
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # Redis 配置（Lettuce 客户端）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2000
      lettuce:
        shutdown-timeout: 3000
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000

  # 邮件配置（生产环境必须通过环境变量注入，禁止硬编码）
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

# ==================== 生产环境告警通知（启用） ====================
notify:
  mail:
    enabled: true
    to: ${NOTIFY_MAIL_TO}

# ==================== 生产环境日志（WARN 级别，减少磁盘 IO） ====================
logging:
  level:
    root: warn
    com.example.platform: info
    com.example.platform.mapper: info

# ==================== 生产环境 MyBatis-Plus（SQL 日志脱离 stdout，W-016 修复） ====================
# 主配置的 StdOutImpl 绕过 SLF4J 直打 System.out，prod 日志级别管不住——覆盖为 NoLoggingImpl
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ==================== 生产环境 OpenAPI 门控（默认关闭） ====================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ==================== 生产环境跨域与 WebSocket Origin ====================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}}

# ==================== 生产环境 JWT 门控 ====================
jwt:
  secret: ${JWT_SECRET}

# ==================== 服务器配置 ====================
server:
  port: 8080
  servlet:
    context-path: /api

# ==================== Spring 公共配置 ====================
spring:
  application:
    name: iot-platform

  # 激活的 Profile，优先从环境变量读取，默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson 配置（JSON 序列化）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway 数据库版本化迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # 开发环境恢复代码时，脚本可能与历史记录 checksum 不一致，跳过校验
    validate-on-migrate: false
    locations: classpath:db/migration

  # 邮件通知配置（生产环境需填写真实值）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除时的值（表示已删除）
      logic-delete-value: 1
      # 未删除时的值
      logic-not-delete-value: 0

# ==================== 日志公共配置（格式，含 MDC traceId） ====================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"

# ==================== Actuator 可观测性端点配置 ====================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ==================== SpringDoc OpenAPI 文档配置 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  paths-to-match: /**

# ==================== 设备监控定时任务配置 ====================
task:
  check-device-cron: 0 0/5 * * * ?
  offline-threshold-seconds: 300
  # 设备数据 TTL 清理：每天凌晨 2 点执行，默认保留 90 天
  cleanup-device-data-cron: 0 0 2 * * ?
  device-data-ttl-days: 90

# ==================== CORS 跨域配置 ====================
cors:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

# ==================== IP 限流配置 ====================
rate-limit:
  enabled: true
  window-seconds: 60
  max-requests: 100

# ==================== 告警通知配置 ====================
notify:
  mail:
    enabled: false
    to: ${NOTIFY_MAIL_TO:}

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:iot-platform-jwt-secret-key-must-be-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:7200}

# ==================== 服务器配置 ====================
server:
  port: 8080
  servlet:
    context-path: /api

# ==================== Spring 公共配置 ====================
spring:
  application:
    name: iot-platform

  # 导入项目根目录 .env 文件（Spring Boot 2.4+ 原生支持）
  # optional: 表示文件不存在时不报错；file:.env[.properties] 按 properties 格式解析
  # 注意：必须放在 spring 下一级，不能嵌套在其他子节点内
  config:
    import: optional:file:.env[.properties]

  # 激活的 Profile，优先从环境变量读取，默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson 配置（JSON 序列化）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway 数据库版本化迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # 已发布迁移禁止改写或复用版本号，启动时强制校验 checksum
    validate-on-migrate: true
    locations: classpath:db/migration

  # 邮件通知配置（生产环境需填写真实值）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:${MAIL_PASSWORD:}}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除时的值（表示已删除）
      logic-delete-value: 1
      # 未删除时的值
      logic-not-delete-value: 0

# ==================== 日志公共配置（格式，含 MDC traceId） ====================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"

# ==================== Actuator 可观测性端点配置 ====================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ==================== SpringDoc OpenAPI 文档配置 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  paths-to-match: /**

# ==================== 设备监控定时任务配置 ====================
task:
  check-device-cron: 0 0/5 * * * ?
  # 离线判定兜底阈值（无 OFFLINE 规则的设备使用；规则阈值优先）
  offline-threshold-seconds: 300
  # 网关离线判定阈值（秒）：启用凭证 last_seen_at 超时产出 GATEWAY_OFFLINE 告警
  gateway-offline-threshold-seconds: 300
  check-gateway-offline-cron: 0 1/5 * * * ?
  # 采样历史保留清理：每天凌晨 2 点，按保留策略分批删除
  cleanup-metric-sample-cron: 0 0 2 * * ?
  cleanup-batch-size: 5000
  # 上报幂等去重键清理：每天 2:30，窗口外的 dedup 键不再有拦截价值
  cleanup-ingest-dedup-cron: 0 30 2 * * ?
  cleanup-ingest-dedup-retention-days: 7

# ==================== CORS 跨域配置 ====================
cors:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

# ==================== WebSocket Origin 配置 ====================
websocket:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

# ==================== IP 限流配置 ====================
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  window-seconds: 60
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:1000}

# ==================== 告警评估与通知配置 ====================
alarm:
  # 恢复侧静默窗口（秒）：恢复要求窗口内无越限采样（S8-1 防抖在恢复侧）
  quiet-window-sec: ${ALARM_QUIET_WINDOW_SEC:300}

notify:
  mail:
    enabled: false
    to: ${NOTIFY_MAIL_TO:}

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:iot-platform-jwt-secret-key-must-be-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:7200}

verification:
  hmac-secret: ${VERIFICATION_CODE_HMAC_SECRET:dev-verification-hmac-secret-change-me}

# ==================== 开放注册开关（自部署实例由管理员控制） ====================
auth:
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}

# ==================== 数据接收门 MQTT 适配器（北向通道） ====================
# dev 默认关闭（HTTP 单跑）；启用前需先起 mosquitto broker（docker compose up mosquitto）
ingest:
  mqtt:
    enabled: ${INGEST_MQTT_ENABLED:false}
    broker-url: ${INGEST_MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${INGEST_MQTT_CLIENT_ID:platform-ingest}
    # S8-5 MQTT 子凭证的 broker 侧供给后端：none（默认，人工配置 broker 用户）
    # 或 mosquitto-dynsec（平台经 $CONTROL/dynamic-security/v1 动态建用户，
    # 需配 broker-auth-admin-username/password，且 broker 预建 dcim-open 角色）
    broker-auth: ${INGEST_MQTT_BROKER_AUTH:none}
    broker-auth-admin-username: ${INGEST_MQTT_BROKER_AUTH_ADMIN_USERNAME:}
    broker-auth-admin-password: ${INGEST_MQTT_BROKER_AUTH_ADMIN_PASSWORD:}
    username: ${INGEST_MQTT_USERNAME:}
    password: ${INGEST_MQTT_PASSWORD:}
    keep-alive-seconds: 30
    # 处理结果回执 topic 前缀：dcim/{accessKey}/ack
    ack-enabled: true

# ==================== 服务器配置 ====================
server:
  port: 8080
  servlet:
    context-path: /api

# ==================== Spring 公共配置 ====================
spring:
  application:
    name: iot-platform

  # 导入项目根目录 .env 文件（Spring Boot 2.4+ 原生支持）
  # optional: 表示文件不存在时不报错；file:.env[.properties] 按 properties 格式解析
  # 注意：必须放在 spring 下一级，不能嵌套在其他子节点内
  config:
    import: optional:file:.env[.properties]

  # 激活的 Profile，优先从环境变量读取，默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson 配置（JSON 序列化）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway 数据库版本化迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # 已发布迁移禁止改写或复用版本号，启动时强制校验 checksum
    validate-on-migrate: true
    locations: classpath:db/migration

  # 邮件通知配置（生产环境需填写真实值）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:${MAIL_PASSWORD:}}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除时的值（表示已删除）
      logic-delete-value: 1
      # 未删除时的值
      logic-not-delete-value: 0

# ==================== 日志公共配置（格式，含 MDC traceId） ====================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"

# ==================== Actuator 可观测性端点配置 ====================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ==================== SpringDoc OpenAPI 文档配置 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  paths-to-match: /**

# ==================== 设备监控定时任务配置 ====================
task:
  check-device-cron: 0 0/5 * * * ?
  # 离线判定兜底阈值（无 OFFLINE 规则的设备使用；规则阈值优先）
  offline-threshold-seconds: 300
  # 采样历史保留清理：每天凌晨 2 点，按保留策略分批删除
  cleanup-metric-sample-cron: 0 0 2 * * ?
  cleanup-batch-size: 5000

# ==================== CORS 跨域配置 ====================
cors:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

# ==================== WebSocket Origin 配置 ====================
websocket:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

# ==================== IP 限流配置 ====================
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  window-seconds: 60
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:1000}

# ==================== 告警通知配置 ====================
notify:
  mail:
    enabled: false
    to: ${NOTIFY_MAIL_TO:}

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:iot-platform-jwt-secret-key-must-be-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:7200}

# ==================== 模拟端写入开关 ====================
simulation:
  write-enabled: ${SIMULATION_WRITE_ENABLED:false}
  # 模拟写入是否触发告警评估（D06，默认关闭：模拟数据不产真实告警）
  alarm-trigger-enabled: ${SIMULATION_ALARM_TRIGGER_ENABLED:false}

verification:
  hmac-secret: ${VERIFICATION_CODE_HMAC_SECRET:dev-verification-hmac-secret-change-me}

# ==================== 开放注册开关（自部署实例由管理员控制） ====================
auth:
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}

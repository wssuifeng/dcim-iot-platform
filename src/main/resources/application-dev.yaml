# ==================== 开发环境配置 ====================

spring:
  # Flyway：开发环境追加 db/seed 演示数据（prod 不包含该 location）
  flyway:
    locations: classpath:db/migration,classpath:db/seed

  # 数据源配置（Druid）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/iot_device_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 开发环境启用连接泄漏检测，便于提前发现问题
      log-abandoned: true
      remove-abandoned: true
      remove-abandoned-timeout: 300

      # Druid 监控统计过滤器，开启后可在 /druid/index.html 查看慢 SQL
      filters: stat,slf4j
      connection-properties: druid.stat.slowSqlMillis=200;druid.stat.logSlowSql=true

      # 开发环境开启 Druid 监控面板，访问 /druid/index.html
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin}

      # Web 请求监控过滤器
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        profile-enable: true

  # Redis 配置（Lettuce 客户端）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2000
      lettuce:
        shutdown-timeout: 3000
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  # 邮件配置（从环境变量读取，继承自 application.yaml 公共配置）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:${MAIL_PASSWORD:}}

# ==================== 开发环境日志（DEBUG 级别） ====================
logging:
  level:
    root: info
    com.example.platform: debug
    com.example.platform.mapper: debug

# ==================== 开发环境健康检查（mail 未配真实主机时跳过，避免 health 卡 20 秒） ====================
management:
  health:
    mail:
      enabled: false

# ==================== 开发环境登录锁定放宽（密码调试期间 60 秒即解锁） ====================
jwt:
  lock-duration: 60

# ==================== 开发环境限流（压测友好） ====================
# 压测时可通过 RATE_LIMIT_ENABLED=false 直接关闭，或保持开启但调高阈值
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  max-requests: 30000
